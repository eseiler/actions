name: 'Lint'
description: 'Format changed files in place with pinned clang-format and cmake-format. Needs no token and no secrets.'
inputs:
  path:
    description: "Work tree to format."
    required: false
    default: "."
  base:
    description: "Base commit; files changed since merge-base(base, HEAD) are formatted."
    required: true
  config:
    description: "Directory containing .clang-format and .cmake-format.yaml."
    required: false
    default: "."
runs:
  using: 'composite'
  steps:
    - name: Install formatters
      shell: bash
      run: |
        python3 -m venv "${RUNNER_TEMP}/lint-venv"
        "${RUNNER_TEMP}/lint-venv/bin/pip" install --quiet --require-hashes --no-deps --only-binary=:all: \
          -r "${GITHUB_ACTION_PATH}/requirements.txt"

    - name: Format
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        BASE: ${{ inputs.base }}
        CONFIG: ${{ inputs.config }}
        CLANG_FORMAT: ${{ runner.temp }}/lint-venv/bin/clang-format
        CMAKE_FORMAT: ${{ runner.temp }}/lint-venv/bin/cmake-format
        PYTHON: ${{ runner.temp }}/lint-venv/bin/python
      run: '"${GITHUB_ACTION_PATH}/format.sh" "${BASE}" "$(realpath "${CONFIG}")"'
