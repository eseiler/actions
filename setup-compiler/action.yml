name: 'Setup Compiler'
description: 'Installs a compiler'
inputs:
  compiler:
    description: "Compiler to install, e.g., gcc-latest, gcc-14, clang-latest or clang-21"
    required: true
runs:
  using: 'composite'
  steps:
  - name: Setup Package Manager
    uses: seqan/actions/setup-package-manager@main

  - name: Install GCC
    if: contains(inputs.compiler, 'gcc')
    shell: bash
    run: ${GITHUB_ACTION_PATH}/install_gcc.sh ${{ inputs.compiler }}

  - name: Install Clang
    if: contains(inputs.compiler, 'clang')
    shell: bash
    run: ${GITHUB_ACTION_PATH}/install_clang.sh ${{ inputs.compiler }}

  - name: Select macOS SDK
    if: runner.os == 'macOS'
    shell: bash
    run: ${GITHUB_ACTION_PATH}/select_sdk.sh

  - name: Export configs
    shell: bash
    run: |
      echo "GNUMAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN) --no-print-directory --output-sync=target" >> "$GITHUB_ENV"
      echo "MAKEFLAGS=-j$(getconf _NPROCESSORS_ONLN) --no-print-directory --output-sync=target" >> "$GITHUB_ENV"
