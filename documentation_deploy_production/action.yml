# Copies built documentation (or CodeChecker reports) to the documentation server with rsync over SSH.
#
# Used by the deploy job of each repository's ci_documentation.yml and by cron_codechecker.yml, in the environment
# `server-deploy`. The SSH key grants the whole server (docs, ftp, ...), so:
#   - it only goes to plain ssh/rsync on the runner (the former burnett01/rsync-deployments ran with
#     StrictHostKeyChecking=no), and only to the host whose key is pinned in known_hosts next to this file;
#   - deploy paths must be absolute and normalised, so that a typo cannot make `rsync --delete` empty a parent
#     directory.

name: 'Deploy Documentation'
description: 'Deploys documentation with rsync over SSH to a host with a pinned host key.'
inputs:
  deploy_host:
    description: "The host to deploy to."
    required: true
  deploy_user:
    description: "The user name for connecting to the host."
    required: true
  deploy_ssh_key:
    description: "The private SSH key for connecting to the host."
    required: true
  source_path_user_doc:
    description: "The path to the user documentation, relative to the workspace (trailing slash: copy contents)."
    required: false
  deploy_path_user_doc:
    description: "The host path to deploy the user documentation to."
    required: false
  source_path_developer_doc:
    description: "The path to the developer documentation, relative to the workspace."
    required: false
  deploy_path_developer_doc:
    description: "The host path to deploy the developer documentation to."
    required: false
runs:
  using: 'composite'
  steps:
    - name: Error if a pull request
      if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
      shell: bash
      run: echo "::error title=Error::This action cannot be run on pull requests."; exit 1

    - name: Deploy
      shell: bash
      env:
        DEPLOY_HOST: ${{ inputs.deploy_host }}
        DEPLOY_USER: ${{ inputs.deploy_user }}
        DEPLOY_SSH_KEY: ${{ inputs.deploy_ssh_key }}
        SOURCE_USER: ${{ inputs.source_path_user_doc }}
        DEST_USER: ${{ inputs.deploy_path_user_doc }}
        SOURCE_DEV: ${{ inputs.source_path_developer_doc }}
        DEST_DEV: ${{ inputs.deploy_path_developer_doc }}
      run: |
        set -Eeuo pipefail
        fail() { echo "::error title=Error::$*"; exit 1; }

        # Check the paths before touching the key.
        [[ -n ${SOURCE_USER} || -n ${SOURCE_DEV} ]] || fail "At least one of source_path_user_doc or source_path_developer_doc must be set."
        for pair in "${SOURCE_USER}|${DEST_USER}" "${SOURCE_DEV}|${DEST_DEV}"; do
          src=${pair%%|*} dst=${pair#*|}
          [[ -z ${src} ]] && continue
          [[ -n ${dst} ]] || fail "A deploy path must be set for ${src}."
          [[ ${dst} == "$(readlink -m "${dst}")" ]] || fail "Deploy paths must be absolute and must not end in '/'."
        done

        # Key and pinned host key in a private temporary directory, removed when the step ends.
        ssh_dir=$(mktemp -d)
        trap 'rm -rf "${ssh_dir}"' EXIT
        install -m 600 /dev/null "${ssh_dir}/key"
        printf '%s\n' "${DEPLOY_SSH_KEY}" > "${ssh_dir}/key"
        grep -v '^#' "${GITHUB_ACTION_PATH}/known_hosts" > "${ssh_dir}/known_hosts" || fail "No pinned host key in known_hosts."
        rsh="ssh -i ${ssh_dir}/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${ssh_dir}/known_hosts"

        # Same rsync options as with burnett01/rsync-deployments before. <source> is relative to the workspace;
        # a trailing slash copies its contents.
        deploy() {
          rsync --recursive --delete --timeout=60 --omit-dir-times --mkpath -e "${rsh}" \
            "${GITHUB_WORKSPACE}/$1" "${DEPLOY_USER}@${DEPLOY_HOST}:$2"
        }
        [[ -z ${SOURCE_USER} ]] || deploy "${SOURCE_USER}" "${DEST_USER}"
        [[ -z ${SOURCE_DEV} ]] || deploy "${SOURCE_DEV}" "${DEST_DEV}"
