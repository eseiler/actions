services:
  clang-20:
    image: ghcr.io/seqan/clang-20
    pull_policy: never
    build:
      args:
        CLANG_VERSION: 20

  clang-21:
    image: ghcr.io/seqan/clang-21
    pull_policy: never
    build:
      args:
        CLANG_VERSION: 21
      tags:
        - ghcr.io/seqan/clang-third-latest

  clang-22:
    image: ghcr.io/seqan/clang-22
    pull_policy: never
    build:
      args:
        CLANG_VERSION: 22
      tags:
        - ghcr.io/seqan/clang-second-latest

  clang-23:
    image: ghcr.io/seqan/clang-23
    pull_policy: never
    build:
      args:
        CLANG_VERSION: 23
      tags:
        - ghcr.io/seqan/clang-latest
