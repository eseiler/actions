services:
  gcc-14:
    image: ghcr.io/seqan/gcc-14
    pull_policy: never
    build:
      args:
        GCC_VERSION: 14
      tags:
        - ghcr.io/seqan/gcc-third-latest

  gcc-15:
    image: ghcr.io/seqan/gcc-15
    pull_policy: never
    build:
      args:
        GCC_VERSION: 15
      tags:
        - ghcr.io/seqan/gcc-second-latest

  gcc-16:
    image: ghcr.io/seqan/gcc-16
    pull_policy: never
    build:
      args:
        GCC_VERSION: 16
      tags:
        - ghcr.io/seqan/gcc-latest
