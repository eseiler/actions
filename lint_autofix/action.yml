# Checks the formatting bundle from Lint Autofix's `prepare` job and pushes it to the PR branch as a signed
# seqan-actions[bot] commit. Used by the `push` job of .github/workflows/lint_autofix.yml, after the GPG key has been
# imported. The checks are in commit.sh.

name: 'Lint Autofix'
description: 'Verify a formatting bundle and push it as a signed seqan-actions[bot] commit. See commit.sh.'
inputs:
  bundle:
    description: "git bundle produced by the unprivileged prepare job."
    required: true
  pr:
    description: "PR number."
    required: true
  head_sha:
    description: "PR head commit the bundle was built on."
    required: true
  head_repo:
    description: "owner/name of the repository holding the PR branch."
    required: true
  head_ref_file:
    description: "File containing the PR branch name (kept out of expressions on purpose)."
    required: true
  token:
    description: "GitHub App installation token with contents: write."
    required: true
runs:
  using: 'composite'
  steps:
    - name: Commit and push
      shell: bash
      env:
        BUNDLE: ${{ inputs.bundle }}
        PR: ${{ inputs.pr }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEAD_REPO: ${{ inputs.head_repo }}
        HEAD_REF_FILE: ${{ inputs.head_ref_file }}
        TOKEN: ${{ inputs.token }}
      run: |
        # Authenticate git with the App token as an HTTP header that git reads from the environment
        # (GIT_CONFIG_COUNT/KEY_n/VALUE_n): the token is never written to disk or put into a URL, where it could show
        # up in .git/config or in error messages.
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0

        SIGN=1 "${GITHUB_ACTION_PATH}/commit.sh" "${BUNDLE}" "https://github.com/${GITHUB_REPOSITORY}.git" "${PR}" \
          "${HEAD_SHA}" "https://github.com/${HEAD_REPO}.git" "$(cat "${HEAD_REF_FILE}")"
