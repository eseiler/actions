# Documentation previews: publish a PR's documentation at https://seqan.github.io/docs-preview/<owner>/<repo>/<pr>/,
# comment the link once, and delete the preview when the PR is closed.
#
# Called from each repository's .github/workflows/docs_preview.yml. A called workflow runs in the caller's context:
# `github.event` is the caller's event, and the environment `docs-preview` with its secret belongs to the caller
# repository. The caller passes exactly the secret declared below; GitHub resolves it with the environment of the
# job that uses it, so it comes from `docs-preview`.
#
#   publish  After the caller's Documentation workflow succeeded on a PR: take its `documentation` artifact and
#            publish it (actions/docs_preview), then comment the URL. With `developer_documentation: true` (seqan3,
#            sharg-parser), the artifacts `documentation` and `documentation-developer` become <pr>/user/ and
#            <pr>/developer/ below a landing page, as with the former documentation_deploy_preview.
#   delete   When the PR is closed (`pull_request_target`, no checkout): delete the preview.
#
# No server access: the App token only reaches seqan/docs-preview (contents) and the caller repository (PR comments).
# The preview HTML was built from PR code; it is hashed into git as data, never executed.
#
# Caller (.github/workflows/docs_preview.yml in the repository; the documentation workflow must be named
# "Documentation" and upload the HTML as artifact `documentation`):
#
#   on:
#     workflow_run:
#       workflows: [Documentation]
#       types: [completed]
#     pull_request_target:
#       types: [closed]
#   permissions: {}
#   jobs:
#     preview:
#       uses: seqan/actions/.github/workflows/docs_preview.yml@main
#       permissions:
#         actions: read
#         pull-requests: read
#       secrets:
#         SEQAN_PR_BOT_KEY: ${{ secrets.SEQAN_PR_BOT_KEY }}
#       # with:
#       #   developer_documentation: true   # repositories with user and developer documentation

name: Documentation Preview

on:
  workflow_call:
    inputs:
      developer_documentation:
        description: "Also publish artifact `documentation-developer`: user/, developer/ and a landing page."
        type: boolean
        required: false
        default: false
    # `required: false` because that is the tested form (probe, 2026-11-09); it must be passed.
    secrets:
      SEQAN_PR_BOT_KEY:
        description: "Private key of the seqan-pr-bot App (environment docs-preview)."
        required: false

permissions: {}

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  publish:
    name: Publish Preview
    if: >-
      github.repository_owner == 'seqan' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: docs-preview # deployment branch: main; holds SEQAN_PR_BOT_KEY
    permissions:
      actions: read        # artifact of the triggering run
      pull-requests: read
    steps:
      # As in lint_autofix.yml: find the PR for the built commit; skip if the PR has a newer head by now (that
      # build publishes instead).
      - name: Resolve PR from trusted event data
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" -f state=open -f head="${HEAD_OWNER}:${HEAD_BRANCH}" \
            | jq --arg sha "${HEAD_SHA}" 'map(select(.head.sha == $sha)) | first // empty' > "${RUNNER_TEMP}/pr.json"
          if [[ ! -s ${RUNNER_TEMP}/pr.json ]]; then
            echo "::notice::No open PR has head ${HEAD_SHA}; nothing to publish."
            exit 0
          fi
          echo "number=$(jq -r .number "${RUNNER_TEMP}/pr.json")" >> "${GITHUB_OUTPUT}"

      # All further steps run only if the PR was found.

      # One documentation: it is the preview. User and developer documentation: user/ and developer/.
      - name: Download documentation
        if: steps.pr.outputs.number
        uses: actions/download-artifact@v8 # locked via actions.lock
        with:
          name: documentation
          path: ${{ runner.temp }}/untrusted/html${{ inputs.developer_documentation && '/user' || '' }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download developer documentation
        if: steps.pr.outputs.number && inputs.developer_documentation
        uses: actions/download-artifact@v8 # locked via actions.lock
        with:
          name: documentation-developer
          path: ${{ runner.temp }}/untrusted/html/developer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Two tokens, each for one repository: the one handed to the publishing code cannot touch the caller repository.
      - name: Token for seqan/docs-preview
        if: steps.pr.outputs.number
        id: preview_token
        uses: actions/create-github-app-token@v3 # locked via actions.lock
        with:
          client-id: ${{ vars.SEQAN_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEQAN_PR_BOT_KEY }}
          repositories: docs-preview
          permission-contents: write

      - name: Publish
        if: steps.pr.outputs.number
        uses: seqan/actions/docs_preview@main
        with:
          source: ${{ runner.temp }}/untrusted/html
          destination: ${{ github.repository }}/${{ steps.pr.outputs.number }}
          token: ${{ steps.preview_token.outputs.token }}
          landing_page: ${{ inputs.developer_documentation }}

      - name: Token for PR comments
        if: steps.pr.outputs.number
        id: comment_token
        uses: actions/create-github-app-token@v3 # locked via actions.lock
        with:
          client-id: ${{ vars.SEQAN_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEQAN_PR_BOT_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      # One comment per PR: later updates go to the same URL.
      - name: Comment
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ steps.comment_token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
          URL: https://seqan.github.io/docs-preview/${{ github.repository }}/${{ steps.pr.outputs.number }}/
        run: |
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --jq '.[] | select(.user.type == "Bot") | .body' | grep -qF 'Documentation preview available'; then
            gh pr comment "${PR}" -R "${GITHUB_REPOSITORY}" --body "Documentation preview available at ${URL}"
          fi

  delete:
    name: Delete Preview
    if: >-
      github.repository_owner == 'seqan' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docs-preview
    steps:
      - name: Token for seqan/docs-preview
        id: preview_token
        uses: actions/create-github-app-token@v3 # locked via actions.lock
        with:
          client-id: ${{ vars.SEQAN_PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SEQAN_PR_BOT_KEY }}
          repositories: docs-preview
          permission-contents: write

      # An empty source deletes the directory; if there was none, the branch stays as it is.
      - name: Delete
        uses: seqan/actions/docs_preview@main
        with:
          source: ''
          destination: ${{ github.repository }}/${{ github.event.pull_request.number }}
          token: ${{ steps.preview_token.outputs.token }}
