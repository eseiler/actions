# Publishes or deletes one documentation preview on https://seqan.github.io/docs-preview/<owner>/<repo>/<pr>/.
# Used by .github/workflows/docs_preview.yml. publish.sh updates the `previews` branch of seqan/docs-preview; then the
# Pages workflow on that repository's main branch is started, because a push to `previews` does not trigger it.

name: 'Documentation Preview'
description: 'Publish (or, with an empty source, delete) a preview on the GitHub Pages site of seqan/docs-preview.'
inputs:
  source:
    description: "Directory with the rendered HTML. Empty deletes the preview."
    required: true
  destination:
    description: "<owner>/<repo>/<pr>, computed from trusted event fields."
    required: true
  token:
    description: "GitHub App installation token with contents: write on the preview repository only."
    required: true
  repository:
    description: "Preview repository."
    required: false
    default: "seqan/docs-preview"
runs:
  using: 'composite'
  steps:
    - name: Update preview branch and trigger the Pages deployment
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        DESTINATION: ${{ inputs.destination }}
        REPOSITORY: ${{ inputs.repository }}
        TOKEN: ${{ inputs.token }}   # for git (see below)
        GH_TOKEN: ${{ inputs.token }} # for gh
      run: |
        # Authenticate git with the App token as an HTTP header that git reads from the environment
        # (GIT_CONFIG_COUNT/KEY_n/VALUE_n): the token is never written to disk or put into a URL.
        GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0

        "${GITHUB_ACTION_PATH}/publish.sh" "${SOURCE}" "${DESTINATION}" "https://github.com/${REPOSITORY}.git" previews

        # Start the Pages workflow (pages.yml on main, `on: repository_dispatch`); needs contents: write.
        gh api "repos/${REPOSITORY}/dispatches" -f event_type=preview-updated
