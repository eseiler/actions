name: 'Setup Cache Action'
description: 'Sets up actions/cache'
inputs:
  ccache_size:
    description: "The ccache maximum size."
    required: false
  cpm_lock_file:
    description: "CPM's package lock. Only needed if not auto-detected correctly."
    required: false
runs:
  using: 'composite'
  steps:
    - name: Get Directories
      id: directories
      shell: bash
      env:
        # In a reusable workflow, github.workflow and github.workflow_ref are the caller's (e.g. "CI" for every stage
        # of a staged ci.yml); job.workflow_* describe the workflow file that defines the current job.
        WORKFLOW: ${{ github.workflow }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        JOB_WORKFLOW_FILE: ${{ job.workflow_file_path }}
      run: |
        set +u
        # Workflow part of the ccache key: the workflow name, plus the file name of the called workflow for a job in a
        # reusable workflow ("CI-ci_linux"). Otherwise all stages of a caller share one key: a later stage restores
        # the cache an earlier stage saved in the same run, an exact key hit, so it never saves its own.
        # Jobs defined directly in a workflow keep the old key (the name only), as does GitHub Enterprise Server,
        # which has no job.workflow_*.
        workflow=${WORKFLOW}
        if [[ -n ${JOB_WORKFLOW_FILE} && ${JOB_WORKFLOW_REF} != "${WORKFLOW_REF}" ]]; then
          file=${JOB_WORKFLOW_FILE##*/}
          workflow+="-${file%.*}"
        fi
        echo "workflow=${workflow}" >> "$GITHUB_OUTPUT"
        echo "ccache=${CCACHE_DIR}" >> $GITHUB_OUTPUT
        echo "cpm=${CPM_SOURCE_CACHE}" >> $GITHUB_OUTPUT
        if [[ -n "${{ inputs.ccache_size }}" ]]; then
          echo "CCACHE_MAXSIZE=${{ inputs.ccache_size }}" >> "$GITHUB_ENV"
        fi
        if [[ -n "${{ inputs.cpm_lock_file }}" ]]; then
          if [[ ! -f "${{ inputs.cpm_lock_file }}" ]]; then
            echo "::error title=Error::\"${{ inputs.cpm_lock_file }}\" does not exist."
          fi
          echo "cpm_lock=${{ inputs.cpm_lock_file }}" >> $GITHUB_OUTPUT
        else
          CPM_LOCK=$(find . -type f -wholename "*/cmake/package-lock.cmake")
          echo "cpm_lock=${CPM_LOCK}" >> $GITHUB_OUTPUT
        fi

    - name: Load ccache
      if: steps.directories.outputs.ccache != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.directories.outputs.ccache }}
        key: ccache-${{ runner.os }}-${{ steps.directories.outputs.workflow }}-${{ matrix.compiler || matrix.name || join(matrix.*, ' - ') || github.job }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ runner.os }}-${{ steps.directories.outputs.workflow }}-${{ matrix.compiler || matrix.name || join(matrix.*, ' - ') || github.job }}-${{ github.ref }}
          ccache-${{ runner.os }}-${{ steps.directories.outputs.workflow }}-${{ matrix.compiler || matrix.name || join(matrix.*, ' - ') || github.job }}

    - name: Load dependency cache
      if: steps.directories.outputs.cpm != '' && steps.directories.outputs.cpm_lock != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.directories.outputs.cpm }}
        key: cpm-${{ hashfiles(steps.directories.outputs.cpm_lock) }}
